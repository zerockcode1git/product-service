apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
 name: product-service-secret-configuration
 namespace: product-service
spec:
 refreshInterval: "24h"
 secretStoreRef:
   name: aws-parameterstore-store
   kind: ClusterSecretStore
 target:
   name: product-service-secret
 data:
 - secretKey: TEST_SECRET
   remoteRef:
     key: /product-service/title #  SSM에 생성한 파라미터 경로
 - secretKey: SUBTITLE
   remoteRef:
     key: /product-service/subtitle

 - secretKey: AWS_SECRET
   sourceRef:
     storeRef:
       name: aws-secretsmanager-store # 이 항목만 Secrets Manager에서 조회
       kind: ClusterSecretStore
   remoteRef:
     key: prod/my-msa # Secrets Manager에 생성한 시크릿 이름
     property: sm/product-service/title # JSON 안에서 사용할 필드
